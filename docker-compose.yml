# Environment bersama untuk semua container Laravel (backend + queue worker).
x-backend-env: &backend-env
  APP_NAME: "${APP_NAME:-SIAP OSN}"
  APP_ENV: local
  APP_DEBUG: "${APP_DEBUG:-false}"
  APP_URL: http://localhost:${BACKEND_PORT:-8000}
  # CORS: daftar origin dipisah koma (config/cors.php). localhost + 127.0.0.1
  # karena keduanya dianggap origin berbeda oleh browser.
  FRONTEND_URL: http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173}
  DB_CONNECTION: pgsql
  DB_HOST: app-db
  DB_PORT: 5432
  DB_DATABASE: ${APP_DB_DATABASE:-osn_readiness}
  DB_USERNAME: ${APP_DB_USERNAME:-sail}
  DB_PASSWORD: ${APP_DB_PASSWORD:-password}
  PERHITUNGAN_URL: http://analytics-api:8000
  PERHITUNGAN_TOKEN: ${INTERNAL_API_TOKEN:-changeme-generate-a-real-secret}
  AUTO_MIGRATE: "true"
  # Folder impor konten (materi/, soal_*.json, gambar/) untuk KontenKabupatenSeeder.
  # Di-mount read-only ke backend dari apps/data-analytics/soal/impor.
  KONTEN_KABUPATEN_FOLDER: /var/www/html/konten-impor
  # Dibaca SuperAdminSeeder. Isi di .env root; tidak ada nilai default di kode.
  SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
  SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}

services:
  # ============================================================================
  # 1. FRONTEND: Vue 3 + Vite (siap-osn-fe)
  # ============================================================================
  frontend:
    build:
      context: ./apps/siap-osn-fe
      dockerfile: Dockerfile
    container_name: osn-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}/api
    volumes:
      - ./apps/siap-osn-fe:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - osn-network

  # ============================================================================
  # 2. BACKEND: Laravel 11 API (Osn-Readiness-Web)
  # ============================================================================
  backend:
    build:
      context: ./apps/Osn-Readiness-Web
      dockerfile: Dockerfile
    container_name: osn-backend
    restart: unless-stopped
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000", "--no-reload"]
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment: *backend-env
    volumes:
      - ./apps/Osn-Readiness-Web:/var/www/html
      - /var/www/html/vendor
      # Bank soal siap impor dari data-analytics (dipakai seeder & impor:konten).
      - ./apps/data-analytics/soal/impor:/var/www/html/konten-impor:ro
    depends_on:
      app-db:
        condition: service_healthy
      analytics-api:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/up"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 90s
    networks:
      - osn-network

  # ============================================================================
  # 2b. QUEUE WORKER: memproses NilaiUlangJob & PurgeAkunJob
  #     (QUEUE_CONNECTION=database, lihat apps/Osn-Readiness-Web/.env.example)
  # ============================================================================
  queue:
    build:
      context: ./apps/Osn-Readiness-Web
      dockerfile: Dockerfile
    container_name: osn-queue
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=3"]
    environment:
      <<: *backend-env
      # Backend sudah memigrasi; worker tidak perlu (dan tidak boleh) migrasi sendiri.
      AUTO_MIGRATE: "false"
    volumes:
      - ./apps/Osn-Readiness-Web:/var/www/html
      - /var/www/html/vendor
    depends_on:
      app-db:
        condition: service_healthy
      analytics-api:
        condition: service_started
      backend:
        condition: service_healthy
    networks:
      - osn-network

  # ============================================================================
  # 2c. SCHEDULER: menjalankan routes/console.php tiap menit (PurgeAkunJob,
  #     simulasi:tutup-kedaluwarsa, sanctum:prune-expired) — pengganti cron
  # ============================================================================
  scheduler:
    build:
      context: ./apps/Osn-Readiness-Web
      dockerfile: Dockerfile
    container_name: osn-scheduler
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    environment:
      <<: *backend-env
      AUTO_MIGRATE: "false"
    volumes:
      - ./apps/Osn-Readiness-Web:/var/www/html
      - /var/www/html/vendor
    depends_on:
      app-db:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - osn-network

  # ============================================================================
  # 3. DATABASE BACKEND: PostgreSQL 16
  # ============================================================================
  app-db:
    image: postgres:16
    container_name: osn-app-db
    restart: unless-stopped
    ports:
      - "${APP_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${APP_DB_DATABASE:-osn_readiness}
      POSTGRES_USER: ${APP_DB_USERNAME:-sail}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:-password}
    volumes:
      - app_pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USERNAME:-sail} -d ${APP_DB_DATABASE:-osn_readiness}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - osn-network

  # ============================================================================
  # 4. ANALYTICS API: FastAPI Python (data-analytics) — Stateless Layanan Hitung
  # ============================================================================
  analytics-api:
    build:
      context: ./apps/data-analytics
      dockerfile: Dockerfile
    container_name: osn-analytics-api
    restart: unless-stopped
    ports:
      - "${ANALYTICS_PORT:-8001}:8000"
    command: ["uv", "run", "--no-sync", "uvicorn", "data_analytics.api:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-changeme-generate-a-real-secret}
    volumes:
      - ./apps/data-analytics:/app
      # Jangan biarkan bind mount menutupi .venv hasil `uv sync` di image.
      - analytics_venv:/app/.venv
    networks:
      - osn-network

networks:
  osn-network:
    driver: bridge

volumes:
  app_pgdata:
  analytics_venv:
