name: CI/CD

on:
  pull_request:
    branches:
      - monorepo
  push:
    branches:
      - monorepo
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monorepo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/siap-osn-fe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun run test:unit

      - name: Build frontend
        env:
          VITE_API_BASE_URL: https://api.example.invalid/api
        run: bun run build

  laravel:
    name: Laravel tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: osn_readiness_testing
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sail -d osn_readiness_testing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: osn_readiness_testing
      DB_USERNAME: sail
      DB_PASSWORD: password
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: bcmath, exif, gd, mbstring, pcntl, pdo_pgsql, zip
          coverage: none

      - name: Install Composer dependencies
        working-directory: apps/Osn-Readiness-Web
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run Laravel tests
        working-directory: apps/Osn-Readiness-Web
        run: composer test

  analytics:
    name: Analytics tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: analytics_test
          POSTGRES_USER: analytics
          POSTGRES_PASSWORD: analytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U analytics -d analytics_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://analytics:analytics@localhost:5432/analytics_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/data-analytics/uv.lock

      - name: Install dependencies
        working-directory: apps/data-analytics
        run: uv sync --frozen --group dev

      - name: Run tests
        working-directory: apps/data-analytics
        run: uv run --frozen pytest

  production-images:
    name: Validate production images
    runs-on: ubuntu-latest
    needs:
      - frontend
      - laravel
      - analytics
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CI environment file
        run: cp .env.production.example .env.production

      - name: Validate production Compose configuration
        run: docker compose --env-file .env.production -f docker-compose.prod.yml config --quiet

      - name: Build production images
        run: docker compose --env-file .env.production -f docker-compose.prod.yml build

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs:
      - production-images
    if: >-
      github.ref == 'refs/heads/monorepo' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment:
      name: production
    steps:
      - name: Checkout deployment script
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_SSH_PRIVATE_KEY" || { echo "Missing VPS_SSH_PRIVATE_KEY" >&2; exit 1; }
          test -n "$VPS_KNOWN_HOSTS" || { echo "Missing VPS_KNOWN_HOSTS" >&2; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Deploy latest monorepo commit
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          test -n "$VPS_HOST" || { echo "Missing VPS_HOST" >&2; exit 1; }
          test -n "$VPS_USER" || { echo "Missing VPS_USER" >&2; exit 1; }
          test -n "$VPS_DEPLOY_PATH" || { echo "Missing VPS_DEPLOY_PATH" >&2; exit 1; }
          [[ "$VPS_DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || {
            echo "VPS_DEPLOY_PATH must be an absolute path using only letters, numbers, '.', '_', '/', and '-'" >&2
            exit 1
          }
          printf -v quoted_deploy_path '%q' "$VPS_DEPLOY_PATH"
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "cd $quoted_deploy_path && git pull --ff-only origin monorepo && bash scripts/deploy-vps.sh --skip-pull"
