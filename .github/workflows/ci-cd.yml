name: CI/CD

on:
  pull_request:
    branches:
      - monorepo
  push:
    branches:
      - monorepo
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monorepo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/siap-osn-fe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun run test:unit

      - name: Build frontend
        env:
          VITE_API_BASE_URL: https://api.example.invalid/api
        run: bun run build

  laravel:
    name: Laravel tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: osn_readiness_testing
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sail -d osn_readiness_testing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: osn_readiness_testing
      DB_USERNAME: sail
      DB_PASSWORD: password
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: bcmath, exif, gd, mbstring, pcntl, pdo_pgsql, zip
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/Osn-Readiness-Web/package-lock.json

      - name: Install Composer dependencies
        working-directory: apps/Osn-Readiness-Web
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Laravel frontend dependencies
        working-directory: apps/Osn-Readiness-Web
        run: npm ci

      - name: Build Laravel frontend assets
        working-directory: apps/Osn-Readiness-Web
        run: npm run build

      - name: Run Laravel tests
        working-directory: apps/Osn-Readiness-Web
        run: composer test

  analytics:
    name: Analytics tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: analytics_test
          POSTGRES_USER: analytics
          POSTGRES_PASSWORD: analytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U analytics -d analytics_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://analytics:analytics@localhost:5432/analytics_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/data-analytics/uv.lock

      - name: Install dependencies
        working-directory: apps/data-analytics
        run: uv sync --frozen --group dev

      - name: Run tests
        working-directory: apps/data-analytics
        run: uv run --frozen pytest

  production-images:
    name: Validate production images
    runs-on: ubuntu-latest
    needs:
      - frontend
      - laravel
      - analytics
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CI environment file
        run: cp .env.production.example .env.production

      - name: Validate production Compose configuration
        run: docker compose --env-file .env.production -f docker-compose.prod.yml config --quiet

      - name: Build production images
        run: docker compose --env-file .env.production -f docker-compose.prod.yml build

  deploy:
    name: Deploy to VPS
    runs-on: self-hosted
    needs:
      - production-images
    if: >-
      github.ref == 'refs/heads/monorepo' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.DEPLOY_VPS_ENABLED == 'true'
    environment:
      name: production
    defaults:
      run:
        working-directory: /home/guntur/osn/src
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy latest monorepo commit
        run: |
          git fetch origin monorepo
          git reset --hard origin/monorepo
          bash scripts/deploy-vps.sh --skip-pull
