# Tuning prefork untuk VPS RAM ±2 GB. Naikkan angka ini bila RAM bertambah.
# MaxRequestWorkers x ~40 MB (mod_php) harus tetap di bawah RAM yang tersedia;
# 48 worker + PHP memory_limit 256M memberi batas aman sebelum OOM host.
# MaxConnectionsPerChild 500 membatasi kebocoran memori antar-request.
<IfModule mpm_prefork_module>
    StartServers             8
    MinSpareServers          8
    MaxSpareServers         16
    MaxRequestWorkers       48
    MaxConnectionsPerChild 500
</IfModule>
