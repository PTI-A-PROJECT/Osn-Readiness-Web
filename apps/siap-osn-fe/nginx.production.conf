server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Aset statis (js/css/json/svg/woff2) dikompres saat dikirim.
    # woff2 sebenarnya sudah terkompresi; tetap didaftarkan agar konsisten
    # dengan tipe aset yang dilayani. Tidak ada aset .gz pre-compressed,
    # jadi gzip_static tidak diaktifkan.
    gzip on;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        text/css
        application/json
        image/svg+xml
        font/woff2;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html tidak boleh di-cache lama: hash aset berubah tiap deploy.
    # Fallback SPA di location / melakukan internal redirect ke sini.
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
